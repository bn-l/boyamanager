<svg xmlns="http://www.w3.org/2000/svg" width="70" height="60" viewBox="-2 -2 25 22" role="img" aria-label="Connecting to the receiver: the letter fades in and out">
  <defs>
    <style><![CDATA[
      /* The same fade the app draws: 1.6s between the two alphas either side of
         MicBadgeIcon's pulseLow and pulseHigh. */
      .badge {
        animation-name: breathe;
        animation-duration: 1.6s;
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;
      }

      @keyframes breathe { 0%,100% { opacity:.18 } 50% { opacity:.5 } }

      @media (prefers-reduced-motion: reduce) {
        .badge { animation: none !important; }
      }
    ]]></style>
  </defs>
  <rect x="-2" y="-2" width="25" height="22" rx="3.5" fill="#16171a"/>
  <g class="badge" fill="#ffffff" stroke="#ffffff" opacity="0.34">
    <path d="M3.8 16.2 L3.8 1.8 L9.6 1.8 C12.196 1.8 14.3 3.322 14.3 5.2 C14.3 7.078 13.091 8.6 11.6 8.6 C13.588 8.6 15.2 10.301 15.2 12.4 C15.2 14.499 12.962 16.2 10.2 16.2 Z" fill="none" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
